[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echelle_spectra"
version = "0.0.2"                       # Consider setuptools_scm later for auto-versioning
description = "Graphical tool for the extraction and analysis of calibrated spectra from 2D Echelle spectrometer images"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Kuzmin Arseniy Aleksandrovich", email = "arseniy.a.kuzmin@gmail.com" },
  { name = "Alexander Liptak", email = "alexadner.liptak.jr@googlemail.com" },
]
keywords = [
  "Echelle", "echelle", "spectra", "spectrum", "spectrometer", "image",
  "calibration", "calibrated", "analysis", "fitting", "GUI", "UI"
]
dependencies = [
  "lmfit>=1.0.3",
  "matplotlib>=3.5.2",
  "numpy>=1.23.1",
  "pyqt5>=5.15.7",
  "pyqtgraph>=0.12.4",
  "scipy>=1.8.1",
  # Make sif_parser optional via extra (see [project.optional-dependencies] below)
  # "sif_parser>=0.3.0",
  'tomli>=2.0.1; python_version < "3.11"',
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/queezz/echelle_spectra"
"Bug Tracker" = "https://github.com/queezz/echelle_spectra/issues"

[project.scripts]
echelle_spectra = "echelle_spectra.echelle_spectra_gui:start"

[project.optional-dependencies]
# Dev tools you already use + a few safe additions
dev = [
  "black>=24.3.0",
  "ruff>=0.5.0",
  "jupyter",
  "PyQt5-stubs",
  "build",
  "twine",
]
# Make sif_parser optional if your runtime can handle its absence
cameras = [
  "sif_parser>=0.3.0"
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"
lint.select = ["E", "F", "W", "I"]  # basic cleanups + import sort

[tool.setuptools]
# If you have package data / icons, turn this on and ship MANIFEST.in
include-package-data = true

# If you prefer explicit discovery:
# [tool.setuptools.packages.find]
# include = ["echelle_spectra*"]

# Optional: if/when you switch to setuptools_scm for auto-versioning:
# [tool.setuptools_scm]
# version_scheme = "no-guess-dev"
# local_scheme = "node-and-date"
