[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echelle_spectra"
version = "0.0.2"                       # Consider setuptools_scm later for auto-versioning
description = "Graphical tool for the extraction and analysis of calibrated spectra from 2D Echelle spectrometer images"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Kuzmin Arseniy Aleksandrovich", email = "arseniy.a.kuzmin@gmail.com" },
  { name = "Alexander Liptak", email = "alexadner.liptak.jr@googlemail.com" },
]
keywords = [
  "Echelle", "echelle", "spectra", "spectrum", "spectrometer", "image",
  "calibration", "calibrated", "analysis", "fitting", "GUI", "UI"
]
dependencies = [
  "lmfit>=1.0.3",
  "matplotlib>=3.5.2",
  "numpy>=1.23.1",
  "pyqt5>=5.15.7",
  "pyqtgraph>=0.12.4",
  "scipy>=1.8.1",
  "sif_parser>=0.3.0",
  "peakutils>=1.3.0",
  'tomli>=2.0.1; python_version < "3.11"',
  "plotly>=5.19.0",
  "nbformat>=5.9.0",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/queezz/echelle_spectra"
"Bug Tracker" = "https://github.com/queezz/echelle_spectra/issues"

[project.scripts]
echelle_spectra = "echelle_spectra.echelle_spectra_gui:start"
echelle-spectrocube = "echelle_spectra.spectrocube_cli:main"

[project.optional-dependencies]
# Dev tools you already use + a few safe additions
dev = [
  "black>=24.3.0",
  "ruff>=0.5.0",
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "jupyterlab>=4.0",
  "notebook>=7.0",
  "PyQt5-stubs",
  "build",
  "twine",
  "pytest>=7.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions>=10.0",
  "mdx_truly_sane_lists>=1.3",
  "mkdocs-glightbox",
]
# SpectroCube neutral calibrated-spectrum container (optional export target)
spectrocube = [
  "spectrocube>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py38"
lint.select = ["E", "F", "W", "I"]  # basic cleanups + import sort

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"echelle_spectra" = [
  "resources/*.toml",
  "resources/*.txt",
  "resources/*.py",
  "resources/graphics/*",
  "resources/calibration_files/*",
  "resources/test_data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

# Optional: if/when you switch to setuptools_scm for auto-versioning:
# [tool.setuptools_scm]
# version_scheme = "no-guess-dev"
# local_scheme = "node-and-date"
