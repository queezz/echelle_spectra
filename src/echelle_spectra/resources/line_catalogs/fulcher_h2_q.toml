blend_note = "Each band lists its Q-branch members in rotational order, so a row's position in the array is its Q number. Five wavelengths below coincide across bands within the spectrograph's resolution (0.0000-0.0934 nm apart, against a ~0.03 nm instrumental width), including the exact 626.2495 pair that Q10(1-1) and Q5(2-2) share. Every one of them sits exactly where its own band's rotational progression predicts, so none is a transcription duplicate and deleting a row would silently renumber the rest of its band. They are listed here instead: overlays still draw them, and any consumer measuring a single line centroid must skip them because the measured centroid is the intensity-weighted blend, not either transition."
