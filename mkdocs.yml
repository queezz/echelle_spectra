site_name: Echelle Spectra
docs_dir: docs

repo_url: https://github.com/queezz/echelle_spectra
repo_name: queezz/echelle_spectra

theme:
  name: material
  logo: assets/echelle.png
  favicon: assets/echelle.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.image.zoom
  palette:
    - scheme: echelle-dark
      primary: custom
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: numpy

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - mdx_truly_sane_lists:
      nested_indent: 4

extra_css:
  - styles/brand.css

nav:
  - Home:
      - Overview: index.md
      - Band data: band-data.md
  - Usage:
      - Basic usage: usage.md
      - Calibration snapshots: calibration-snapshots.md
      - Durable campaign runs: campaign-runs.md
      - Pattern extraction: pattern-extraction.md
      - Calibration alignment: calibration-alignment.md
      - Wavelength line validation: line-validation.md
      - Exporting to SpectroCube: spectrocube-export.md
      - Batch SpectroCube workflow: spectrocube-batch-workflow.md
  - API:
      - Pattern extraction: pattern-extraction-api.md
      - SpectroCube export: spectrocube-export-api.md
  - Development:
      - Developer notes: development.md
  - Archaeology & Refactor:
      - Repository archaeology report: archaeology/report.md
